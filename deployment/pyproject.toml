[project]
name = "fastwam-openarm-deployment"
version = "0.1.0"
description = "Locked Linux CUDA 12.8 environment for the OpenArm FastWAM server"
requires-python = ">=3.10,<3.11"
dependencies = [
  "fastwam",
  "openarm-policy-runtime",
  "torch==2.7.1+cu128",
  "torchvision==0.22.1+cu128",
  "torchcodec==0.4.0+cu128",
  "setuptools>=68,<81",
  "uv==0.12.11",
]

[project.optional-dependencies]
dora = ["dora-openarm-local-policy-server", "dora-rs==0.5.0"]

[dependency-groups]
test = ["pytest>=8,<9"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
fastwam = { path = "..", editable = true }
openarm-policy-runtime = { path = "../../../packages/openarm-policy-runtime", editable = true }
dora-openarm-local-policy-server = { path = "../../../nodes/dora-openarm-local-policy-server", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchcodec = { index = "pytorch-cu128" }
